<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Dinámicas Alex 2027
        {% endblock %}
    </title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="top">

        <a href="{{ url_for('home') }}" class="brand-link">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Dinámicas Alex 2027" class="brand-logo">
            <div>
                <div class="brand">
                    DINÁMICAS <b>ALEX 2027</b>
                </div>
                <div class="mini">
                    RIFAS • LOTERÍAS DIARIAS
                </div>
            </div>
        </a>

    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for c, m in messages %}

            <div class="flash {{ c }}">
                {{ m }}
            </div>

        {% endfor %}

    {% endwith %}


    {% block body %}
    {% endblock %}


    <div class="footer">
        🍀 Dinámicas Alex 2027 · RIFAS • LOTERÍAS DIARIAS
    </div>

</body>

</html>
