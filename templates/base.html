<!doctype html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Dinámicas Alex 2027
        {% endblock %}
    </title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="top">

        <a href="{{ url_for('home') }}" class="brand-link">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Dinámicas Alex 2027" class="brand-logo">
            <div>
                <div class="brand">
                    DINÁMICAS <b>ALEX 2027</b>
                </div>
                <div class="mini">
                    RIFAS • LOTERÍAS DIARIAS
                </div>
            </div>
        </a>

    </div>


    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for c, m in messages %}

            <div class="flash {{ c }}">
                {{ m }}
            </div>

        {% endfor %}

    {% endwith %}


    {% block body %}
    {% endblock %}


    <div class="footer">
        🍀 Dinámicas Alex 2027 · RIFAS • LOTERÍAS DIARIAS
    </div>

    <!-- BOTÓN FLOTANTE PERMANENTE DE WHATSAPP -->
    <a href="https://api.whatsapp.com/send?text=¡Hola%20*DINÁMICAS%20ALEX%202027*!%20🍀%20Deseo%20información%20o%20apartar%20mi%20número%20para%20la%20dinámica%20de%20hoy." 
       class="wa-float-btn" 
       id="wa-float-global"
       target="_blank" 
       rel="noopener noreferrer" 
       title="Chatea con nosotros por WhatsApp">
        <span class="wa-float-tooltip">💬 ¿Dudas o apartar boleta? Chatea aquí</span>
        <svg viewBox="0 0 32 32" class="wa-float-icon">
            <path d="M16 2C8.268 2 2 8.268 2 16c0 2.82.83 5.446 2.26 7.647L2.42 30l6.577-1.724A13.914 13.914 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm8.01 19.897c-.334.94-1.657 1.72-2.316 1.83-.62.103-1.428.147-2.308-.135-.572-.183-1.31-.427-2.274-.84-4.004-1.733-6.623-5.787-6.822-6.05-.198-.265-1.624-2.16-1.624-4.12 0-1.96 1.025-2.923 1.39-3.32.365-.397.794-.497 1.06-.497.265 0 .53.003.762.015.244.013.57-.093.893.682.333.795 1.135 2.766 1.235 2.966.1.199.167.43.033.695-.132.265-.2.43-.398.662-.198.232-.418.52-.596.7-.198.198-.405.413-.174.81.232.397 1.03 1.7 2.213 2.755 1.52 1.356 2.802 1.777 3.2 1.976.398.199.63.166.862-.1.232-.266.994-1.16 1.26-1.558.265-.397.53-.33.894-.198.364.132 2.318 1.093 2.716 1.292.398.198.663.298.762.463.1.166.1 1.027-.234 1.967z" fill="currentColor"/>
        </svg>
    </a>

</body>

</html>
